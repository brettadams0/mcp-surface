<text x="18" y="57" clip-path="url(#c)"><tspan class="green">$</tspan> mcp-surface node test/fixtures/broken-server.js</text>
<text class="l1" x="18" y="76"><tspan class="b">broken-fixture</tspan> <tspan class="d">1.0.0</tspan> <tspan class="d">(105ms)</tspan></text>
<text class="l2" x="18" y="95"><tspan class="d">5 tools · 0 resources · 0 prompts · capabilities: tools</tspan></text>
<text class="l3" x="18" y="114"></text>
<text class="l4" x="18" y="133">  <tspan class="cyan">unsatisfiable</tspan><tspan class="d"> — Requires an argument that its schema never defines.</tspan></text>
<text class="l5" x="18" y="152">  <tspan class="cyan">wrong_root_type</tspan><tspan class="d"> — Declares an array where the spec requires an object.</tspan></text>
<text class="l6" x="18" y="171">  <tspan class="cyan">bad_schema</tspan><tspan class="d"> — Uses a type keyword that is not valid JSON Schema.</tspan></text>
<text class="l7" x="18" y="190">  <tspan class="cyan">duplicate</tspan><tspan class="d"> — First registration.</tspan></text>
<text class="l8" x="18" y="209">  <tspan class="cyan">duplicate</tspan><tspan class="d"> — Second registration, shadowed by the first.</tspan></text>
<text class="l9" x="18" y="228"></text>
<text class="l10" x="18" y="247">  <tspan class="red">error</tspan>  <tspan class="cyan">wrong_root_type</tspan> inputSchema.type is "array", but MCP requires "object" </text>
<text class="l11" x="18" y="266"><tspan class="d">         </tspan><tspan class="d">[schema-root-type]</tspan></text>
<text class="l12" x="18" y="285">  <tspan class="red">error</tspan>  <tspan class="cyan">bad_schema</tspan> inputSchema is not valid JSON Schema: schema is invalid: </text>
<text class="l13" x="18" y="304">         data/properties/count/type must be equal to one of the allowed values, </text>
<text class="l14" x="18" y="323">         data/properties/count/type must be array, data/properties/count/type must </text>
<text class="l15" x="18" y="342">         match a schema in anyOf <tspan class="d">[schema-valid]</tspan></text>
<text class="l16" x="18" y="361">  <tspan class="red">error</tspan>  <tspan class="cyan">unsatisfiable</tspan> inputSchema.required lists "apiKey" with no matching entry </text>
<text class="l17" x="18" y="380">         in properties — those arguments can never be satisfied </text>
<text class="l18" x="18" y="399"><tspan class="d">         </tspan><tspan class="d">[schema-required-props]</tspan></text>
<text class="l19" x="18" y="418">  <tspan class="red">error</tspan>  <tspan class="cyan">duplicate</tspan> Advertised 2 times — only one of them is reachable by a client </text>
<text class="l20" x="18" y="437"><tspan class="d">         </tspan><tspan class="d">[tool-duplicate-name]</tspan></text>
<text class="l21" x="18" y="456">  <tspan class="d">info </tspan>  <tspan class="cyan">bad_schema</tspan> 1 input property has no description: count </text>
<text class="l22" x="18" y="475"><tspan class="d">         </tspan><tspan class="d">[schema-property-descriptions]</tspan></text>
<text class="l23" x="18" y="494"></text>
<text class="l24" x="18" y="513">4 errors, 0 warnings, 1 info</text>
