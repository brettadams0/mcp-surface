name: Publish verified mcp-surface 0.4.0 through trusted workflow

on:
  push:
    branches: [main]
    paths: [.github/workflows/ship-0.4.0.yml]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build
      - name: Publish matching Git tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.4.0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null; then
            git tag v0.4.0 "$GITHUB_SHA"
            git push origin refs/tags/v0.4.0
          fi
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            gh release create v0.4.0 --title 'mcp-surface 0.4.0' --generate-notes --target "$GITHUB_SHA"
          fi
      - name: Dispatch existing npm OIDC release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if npm view mcp-surface@0.4.0 version >/dev/null 2>&1; then
            echo '0.4.0 already published; no duplicate npm publish'
          else
            gh workflow run release.yml --ref v0.4.0
            echo 'Dispatched trusted release.yml for npm 0.4.0'
          fi
