name: Release

# Publishes to npm via Trusted Publishing (OIDC) — no tokens, no OTP.
#
# One-time setup, which can only be done AFTER the package exists on the
# registry (npm has no way to attach a trusted publisher to a package that
# hasn't been published yet — see https://github.com/npm/cli/issues/8544):
#
#   npmjs.com -> mcp-surface -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: brettadams0
#     Repository:           mcp-surface
#     Workflow filename:    release.yml
#     Allowed actions:      npm publish
#
# Then, for every release after the first:
#   npm version patch|minor|major   # commits + tags
#   git push --follow-tags
#   gh release create vX.Y.Z --generate-notes
#
# Publishing from CI also attaches build provenance automatically, so the
# package page shows which commit and workflow produced the tarball.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC — without it npm falls back to token auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14. Node 24
      # satisfies both, but npm is upgraded explicitly so a change to the
      # runner's bundled npm can't silently drop us below the floor.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json, which is the
      # easiest way to ship the wrong version from a release trigger.
      - name: Check tag matches package.json
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing $pkg"

      - run: npm publish --access public
