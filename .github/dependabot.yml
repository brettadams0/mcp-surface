# Monthly and grouped, so keeping dependencies current costs one pull request a
# month rather than one per package. Security updates are not on this schedule:
# GitHub raises those as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types track the engines floor (>=22.12), not the newest runtime: newer
      # @types/node would typecheck calls that throw on the Node we support.
      # Move this together with engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
