# Monthly and grouped, so keeping dependencies current costs one pull request a
# month rather than one per package. Security updates are not on this schedule:
# GitHub raises those as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Both are pinned to the oldest Node the package supports (engines: >=20.19).
    # vitest 5 refuses to run below Node 22.12, so taking it means either losing
    # the Node 20 CI leg or dropping Node 20 from engines. That is a support
    # decision, not a dependency bump. @types/node above 20 would let the code
    # call APIs that Node 20 doesn't have without the typechecker noticing.
    # Remove both entries when engines moves to >=22.
    ignore:
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
